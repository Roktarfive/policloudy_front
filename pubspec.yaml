name: policloudy
description: "Estación de Monitoreo Ambiental - PoliCloudy Dashboard"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # HTTP Client
  dio: ^5.7.0

  # File picker
  file_picker: ^8.1.4

  # HTTP media types (content-type headers)
  http_parser: ^4.0.2

  # Charts
  fl_chart: ^0.68.0

  # Icons
  flutter_svg: ^2.0.10+1

  # Intl / Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
